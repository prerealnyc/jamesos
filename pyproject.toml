[project]
name = "james-os"
version = "0.1.0"
description = "JAMES OS — memory substrate API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "httpx>=0.27",
  "anthropic>=0.39",
  "openai>=1.50",
  "google-auth>=2.34",
  "google-api-python-client>=2.140",
  "voyageai>=0.3",
  "cohere>=5.11",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "bcrypt>=4.2.0",
  "PyJWT>=2.10.0",
  "cryptography>=43",
  "xpoz>=0.7",
  "fonttools>=4.53",
  # Face detection for text placement (src/james_os/people.py). HEADLESS on
  # purpose: plain opencv-python wants libGL.so.1, which python:3.12-slim has
  # not got, and opencv-contrib (what MediaPipe pins) is the 82 MB GUI build.
  # The 232 KB YuNet model is vendored at src/james_os/models/ rather than
  # downloaded at boot, so a render never waits on the network.
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "httpx>=0.27",
]
# Music-bed extraction (audio_separate.py). Demucs pulls in PyTorch, which is a
# very large install for a feature most renders never touch — so it stays
# OPTIONAL and every call site checks `audio_separate.available()` first. The
# app boots and every other feature works without it.
#   pip install -e '.[separate]'
separate = [
  "demucs>=4.0",
  "torch>=2.1",
  "torchaudio>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/james_os"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "nodb: pure-logic test — skips the Postgres fixture so it runs anywhere",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
